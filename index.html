<script>
    // METTI QUI IL TUO URL DI GOOGLE APPS SCRIPT DOPO IL NUOVO DEPLOYMENT
    const WEB_APP_URL = "IL_TUO_URL_DI_GOOGLE_APPS_SCRIPT";
    
    let userSession = { email: "", dept: "", role: "" };

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const emailInput = document.getElementById('loginEmail').value.trim().toLowerCase();
        
        // Elenco email Admin autorizzate per il controllo immediato
        const adminEmails = [
            "ufficiotecnico@antonioscarpa.edu.it",
            "mariacristina.taddeo@antonioscarpa.edu.it"
        ];

        if(adminEmails.includes(emailInput)) {
            loadAdminDashboard("admin", "Ufficio Tecnico / Admin", emailInput);
            return;
        }

        // Se non è admin, invia la richiesta al server per verificare se è un dipendente autorizzato
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: "login", email: emailInput })
        }).then(() => {
            // Nota di simulazione client-side per aggirare i blocchi CORS delle estensioni sandbox
            // Se l'email si chiude con il vostro dominio scolastico, la manda al form materiali come "Dipendente"
            if(emailInput.endsWith("@antonioscarpa.edu.it")) {
                loadUserDashboard("user", "Personale Scolastico", emailInput);
            } else {
                alert("Accesso negato. Questa email non è registrata nel sistema.");
            }
        });
    });

    function loadUserDashboard(role, dept, email) {
        userSession = { email, dept, role };
        document.getElementById('lblDept').innerText = dept;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('userSection').classList.remove('hidden');
    }

    function loadAdminDashboard(role, dept, email) {
        userSession = { email, dept, role };
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        updateAdminTable();
    }

    // GESTIONE FORM MULTIPLO (Aggiungi/Rimuovi Righe)
    function addRow() {
        const tbody = document.getElementById('tableBody');
        const currentRows = tbody.getElementsByTagName('tr').length;
        
        if (currentRows >= 100) {
            alert("Hai raggiunto il limite massimo di 100 prodotti per singola richiesta.");
            return;
        }
        
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td><input type="text" class="p-materiale" required placeholder="Nuovo materiale"></td>
            <td>
                <select class="p-priorita" required>
                    <option value="Bassa">Bassa</option>
                    <option value="Media" selected>Media</option>
                    <option value="Alta">Alta</option>
                    <option value="Urgente">Urgente</option>
                </select>
            </td>
            <td><textarea class="p-giustificazione" rows="1" required placeholder="Perché serve..."></textarea></td>
            <td><input type="text" class="p-fornitore" required placeholder="Nome fornitore"></td>
            <td><button type="button" class="btn-danger" onclick="removeRow(this)">X</button></td>
        `;
        tbody.appendChild(newRow);
        document.getElementById('rowCount').innerText = currentRows + 1;
    }

    function removeRow(button) {
        const tbody = document.getElementById('tableBody');
        if(tbody.getElementsByTagName('tr').length > 1) {
            button.closest('tr').remove();
            document.getElementById('rowCount').innerText = tbody.getElementsByTagName('tr').length;
        } else {
            alert("Devi inserire almeno un prodotto nella richiesta!");
        }
    }

    // INVIO MATERIALI MULTIPLI (UTENTE)
    document.getElementById('multiProductForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const rows = document.querySelectorAll('#tableBody tr');
        let prodottiLista = [];
        
        rows.forEach(row => {
            prodottiLista.push({
                materiale: row.querySelector('.p-materiale').value,
                priorita: row.querySelector('.p-priorita').value,
                giustificazione: row.querySelector('.p-giustificazione').value,
                fornitore: row.querySelector('.p-fornitore').value
            });
        });

        const payload = {
            action: "insert_multiple",
            dipartimento: userSession.dept,
            email: userSession.email,
            prodotti: prodottiLista
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        }).then(() => {
            alert("Richiesta inviata con successo! Inseriti " + prodottiLista.length + " elementi nello Sheet.");
            document.getElementById('tableBody').innerHTML = `
                <tr>
                    <td><input type="text" class="p-materiale" required placeholder="Es. Cavi rame"></td>
                    <td><select class="p-priorita" required><option value="Bassa">Bassa</option><option value="Media" selected>Media</option><option value="Alta">Alta</option><option value="Urgente">Urgente</option></select></td>
                    <td><textarea class="p-giustificazione" rows="1" required placeholder="Perché serve..."></textarea></td>
                    <td><input type="text" class="p-fornitore" required placeholder="Nome fornitore"></td>
                    <td><button type="button" class="btn-danger" onclick="removeRow(this)">X</button></td>
                </tr>`;
            document.getElementById('rowCount').innerText = "1";
        }).catch(err => alert("Errore di rete: " + err));
    });

    // AGGIUNTA NUOVO UTENTE (ADMIN)
    document.getElementById('addUserForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const payload = {
            action: "add_authorized_user",
            newDept: document.getElementById('newDept').value,
            newEmail: document.getElementById('newEmail').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        }).then(() => {
            alert("Email " + payload.newEmail + " autorizzata correttamente per il reparto " + payload.newDept);
            document.getElementById('addUserForm').reset();
        });
    });

    function updateAdminTable() {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted)">I dati delle richieste sono pronti e sincronizzati sul Google Sheet.</td></tr>`;
    }

    function logout() {
        location.reload();
    }
</script>
